services:
  tee-relay:
    build:
      context: .
      dockerfile: Dockerfile.enclave
      args:
        # "" builds the simulated-only relay; "snp" builds the SEV-SNP runtime.
        CARGO_FEATURES: ""
    ports:
      # Published on the host's loopback only. Put an authenticating proxy in
      # front before exposing it further.
      - "127.0.0.1:3100:3100"
    environment:
      - RUST_LOG=info
      - SELKEY_TEE_DATA_DIR=/var/lib/selkey-tee
      # Listen on all interfaces inside the container so the published port
      # reaches the relay. The relay defaults to 127.0.0.1.
      - SELKEY_BIND_ADDR=0.0.0.0
      # The default build has no SEV-SNP support, so it runs the simulated
      # runtime (no hardware isolation), which must be allowed explicitly.
      # Remove this line for an SEV-SNP build: the relay then refuses to start
      # if SEV-SNP initialisation fails.
      - SELKEY_ALLOW_SIMULATED=1
      # Standard relay mode by default. For echo testing:
      # - SELKEY_TEE_ECHO_MODE=true
    # SEV-SNP build (CARGO_FEATURES: "snp"): pass the guest device. The
    # container user needs read/write access to it (see docs/deployment.md).
    # devices:
    #   - /dev/sev-guest:/dev/sev-guest
    volumes:
      - tee-data:/var/lib/selkey-tee

volumes:
  tee-data:
